<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Love You Rinku ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse at center,#260d25,#08050d 75%);
  font-family:Georgia,serif
}
main{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:12px
}
h1{
  margin:0;color:#ffd6e8;font-weight:normal;
  font-size:clamp(24px,6vw,38px);letter-spacing:2px;
  text-shadow:0 0 22px #ff3998;text-align:center
}
.sub{color:#d8b5cf;font-size:14px;text-align:center;margin:8px 0}
canvas{width:min(96vw,650px);height:min(67svh,600px);display:block}
button{
  border:1px solid #ffacd0;border-radius:30px;padding:12px 24px;
  background:linear-gradient(135deg,#e42e82,#7d245f);
  color:white;letter-spacing:1px;cursor:pointer;
  box-shadow:0 0 24px #ff3c9233
}
.signature{font-size:11px;letter-spacing:3px;color:#b99bb9;margin-top:13px}
</style>
</head>
<body>
<main>
  <h1>FOR MY RINKU ❤️</h1>
  <div class="sub">Every word is written with love...</div>
  <canvas id="heart"></canvas>
  <button id="again">♡ MAKE MY HEART AGAIN ♡</button>
  <div class="signature">FOREVER YOURS · JAGAN</div>
</main>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const phrase = "I LOVE YOU RINKU ♥";
let W=0,H=0,rows=[],stars=[],progress=0,last=0,done=false;

function boundary(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:13*Math.cos(t)-5*Math.cos(2*t)
      -2*Math.cos(3*t)-Math.cos(4*t)
  };
}

function makeHeart(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  W=rect.width;H=rect.height;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const scale=Math.min(W/37,H/34)*0.94;
  const cx=W/2,cy=H/2+2;
  const outline=[];

  for(let i=0;i<=1200;i++){
    const p=boundary(i/1200*Math.PI*2);
    outline.push({
      x:cx+p.x*scale,
      y:cy-p.y*scale
    });
  }

  rows=[];
  ctx.font=`bold ${Math.max(8,Math.min(12,scale*.68))}px Georgia`;
  const fontSize=Math.max(8,Math.min(12,scale*.68));
  const phraseWidth=ctx.measureText(phrase).width+10;
  const rowGap=fontSize+5;

  let top=Infinity,bottom=-Infinity;
  for(const p of outline){
    top=Math.min(top,p.y);
    bottom=Math.max(bottom,p.y);
  }

  // Find the actual left and right heart boundaries at each height.
  for(let y=top+3;y<bottom-2;y+=rowGap){
    const hits=[];

    for(let i=0;i<outline.length-1;i++){
      const a=outline[i],b=outline[i+1];

      if((a.y<=y&&b.y>y)||(b.y<=y&&a.y>y)){
        const x=a.x+(y-a.y)*(b.x-a.x)/(b.y-a.y);
        hits.push(x);
      }
    }

    if(hits.length>=2){
      hits.sort((a,b)=>a-b);
      const left=hits[0]+3,right=hits[hits.length-1]-3;
      const count=Math.floor((right-left)/phraseWidth);

      if(count>0){
        const total=count*phraseWidth;
        const start=(left+right-total)/2;
        rows.push({y,start,count,width:phraseWidth});
      }
    }
  }

  stars=Array.from({length:75},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.4+.3,phase:Math.random()*6.28
  }));
}

function draw(time=0){
  ctx.clearRect(0,0,W,H);

  for(const s of stars){
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,195,226,${.2+.6*(.5+.5*Math.sin(time*.002+s.phase))})`;
    ctx.fill();
  }

  const fontSize=Math.max(8,Math.min(12,Math.min(W/37,H/34)*.94*.68));
  ctx.font=`bold ${fontSize}px Georgia`;
  ctx.textBaseline="middle";
  ctx.textAlign="left";

  const show=Math.floor(progress);
  const glow=done?12+8*Math.sin(time*.004):6;
  ctx.shadowColor="#ff4a9d";
  ctx.shadowBlur=glow;

  // Reveal the heart line by line, following its real outline.
  for(let i=0;i<Math.min(show,rows.length);i++){
    const row=rows[i];

    for(let j=0;j<row.count;j++){
      const x=row.start+j*row.width;
      ctx.fillStyle="#ffc0df";
      ctx.fillText(phrase,x,row.y);
    }
  }

  ctx.shadowBlur=0;

  if(done){
    ctx.textAlign="center";
    ctx.font=`italic ${Math.min(16,fontSize+4)}px Georgia`;
    ctx.fillStyle="#fff0f8";
    ctx.shadowColor="#ff4a9d";
    ctx.shadowBlur=16;
    ctx.fillText("Made with love, Rinku ❤️",W/2,H-8);
    ctx.shadowBlur=0;
  }
}

function animate(time){
  if(!last)last=time;
  const delta=Math.min(time-last,40);
  last=time;

  if(!done){
    progress+=delta/95;
    if(progress>=rows.length){
      progress=rows.length;
      done=true;
    }
  }

  draw(time);
  requestAnimationFrame(animate);
}

document.getElementById("again").addEventListener("click",()=>{
  progress=0;done=false;last=0;
});

window.addEventListener("resize",makeHeart);
makeHeart();
requestAnimationFrame(animate);
</script>
</body>
</html>
